# Boolean Causal Micro-Lab GRPO smoke run.
# Uses the frozen pilot rows but only expects a short allocation.

prepare_datasets: 0
causal_micro_lab_generate_dataset_if_missing: 1
causal_micro_lab_dataset_preset: pilot
causal_micro_lab_dataset_output_dir: data/causal_micro_lab/pilot
causal_micro_lab_dataset_seed: 1
causal_micro_lab_eval_preset: canonical_eval
causal_micro_lab_eval_output_dir: data/causal_micro_lab/canonical_eval
causal_micro_lab_eval_seed: 1
causal_micro_lab_target_counts: 4,8,16
causal_micro_lab_progress_every: 128

discovery_algo: grpo
model_id: Qwen/Qwen3-4B
download_model: 1
attn_implementation: sdpa
use_remove_padding: "False"
default_agent_loop: causal_micro_lab_agent_loop

train_file: data/causal_micro_lab/pilot/verl_val.jsonl
val_file: data/causal_micro_lab/canonical_eval/verl_test.jsonl

n_gpus_per_node: 4
train_batch_size: 32
ppo_mini_batch_size: 16
rollout_n: 4
total_epochs: 1
save_freq: 5
test_freq: 2
max_prompt_length: 2048
max_response_length: 256
experiment_name_prefix: causal_micro_lab_validity_smoke_qwen3_4b_r4

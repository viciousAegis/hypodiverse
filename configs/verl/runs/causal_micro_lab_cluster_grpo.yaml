# Main validity-only GRPO baseline for one two-GPU Slurm node.
#
# Sixteen prompts x 8 rollouts produces 128 responses per update and preserves
# the GRPO group size used by the LIFPO comparison.

prepare_datasets: 0
causal_micro_lab_generate_dataset_if_missing: 0
causal_micro_lab_rebuild_dataset: 0
causal_micro_lab_dataset_preset: trainable
causal_micro_lab_dataset_output_dir: data/causal_micro_lab/trainable
causal_micro_lab_dataset_seed: 1
causal_micro_lab_target_counts: 4,8,16
causal_micro_lab_val_states_per_count: 43
causal_micro_lab_test_states_per_count: 43
causal_micro_lab_val_max_rows: 128
causal_micro_lab_test_max_rows: 128
causal_micro_lab_progress_every: 512

# Base reward ladder before overlong shaping:
#   0.0 = empty or unparseable
#   0.2 = syntax-valid but evidence-invalid hypothesis
#   1.0 = evidence-valid hypothesis
causal_micro_lab_nonempty_output_reward: 0.0
causal_micro_lab_rule_marker_reward: 0.0
causal_micro_lab_parse_valid_reward: 0.0
causal_micro_lab_syntax_valid_reward: 0.2
causal_micro_lab_evidence_consistent_reward: 0.0
causal_micro_lab_valid_hypothesis_reward: 1.0

# Match the LIFPO response budget and overlong handling.
causal_micro_lab_length_penalty_start: 3072
causal_micro_lab_length_penalty_max: -0.2
causal_micro_lab_mask_truncated: 1

discovery_algo: grpo
model_id: Qwen/Qwen3-4B
model_basename: Qwen3-4B
download_model: 1
attn_implementation: sdpa
use_remove_padding: "False"
default_agent_loop: causal_micro_lab_agent_loop

train_file: data/causal_micro_lab/trainable/verl_train.jsonl
val_file: data/causal_micro_lab/trainable/verl_val.jsonl

n_gpus_per_node: 2
train_batch_size: 16
ppo_mini_batch_size: 8
rollout_n: 8
rollout_tp: 1
rollout_gpu_mem_util: 0.50
actor_micro_batch_size_per_gpu: 1
rollout_log_prob_micro_batch_size_per_gpu: 1
rollout_calculate_log_probs: "False"
ref_log_prob_micro_batch_size_per_gpu: 1
actor_lr: 1e-6
kl_loss_coef: 0.001
entropy_coeff: 0

temperature: 1.0
top_p: 1.0
total_epochs: 1
total_training_steps: 100
save_freq: 10
test_freq: 10
max_actor_ckpt_to_keep: 1
max_critic_ckpt_to_keep: 1
max_prompt_length: 2048
max_response_length: 6000

# Stable naming makes an interrupted Slurm job resumable with the same command.
experiment_name: hypodiverse_grpo_r1

# First meaningful scattered-causal learning run. With defaults this targets
# about 256 actor optimizer updates on one 4-GPU node.

dataset_config: configs/verl/datasets/scattered_pilot.yaml
prepare_datasets: 1

discovery_algo: grpo
model_id: Qwen/Qwen3-4B
download_model: 1
train_file: data/verl/scattered_causal_pilot_train.parquet
val_file: data/verl/scattered_causal_pilot_val.parquet

n_gpus_per_node: 4
train_batch_size: 64
ppo_mini_batch_size: 32
rollout_n: 4
total_epochs: 1
save_freq: 25
test_freq: 10
max_prompt_length: 2048
max_response_length: 4096
experiment_name_prefix: scattered_pilot_qwen3_4b

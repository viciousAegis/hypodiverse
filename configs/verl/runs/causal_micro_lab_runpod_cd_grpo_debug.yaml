# One-step, one-GPU integration test for the complete CD-GRPO/veRL path.
# It preserves the production rollout geometry while using a small model and
# short responses to keep debugging inexpensive.

prepare_datasets: 0
causal_micro_lab_generate_dataset_if_missing: 1
causal_micro_lab_rebuild_dataset: 0
causal_micro_lab_dataset_preset: trainable
causal_micro_lab_dataset_output_dir: data/causal_micro_lab/trainable
causal_micro_lab_dataset_seed: 1
causal_micro_lab_target_counts: 4,8,16
causal_micro_lab_val_states_per_count: 3
causal_micro_lab_test_states_per_count: 3
causal_micro_lab_val_max_rows: 8
causal_micro_lab_test_max_rows: 8
causal_micro_lab_progress_every: 128

causal_micro_lab_nonempty_output_reward: 0.0
causal_micro_lab_rule_marker_reward: 0.0
causal_micro_lab_parse_valid_reward: 0.0
causal_micro_lab_syntax_valid_reward: 0.2
causal_micro_lab_evidence_consistent_reward: 0.0
causal_micro_lab_valid_hypothesis_reward: 1.0
causal_micro_lab_length_penalty_start: 384
causal_micro_lab_length_penalty_max: -0.2
causal_micro_lab_mask_truncated: 1

trainer_entrypoint: scattered_discovery.verl.cd_grpo_main
cd_grpo_variant: logdet
cd_grpo_archive: "true"
cd_grpo_beta: 0.3
cd_grpo_beta_guard: "true"
cd_grpo_beta_guard_window: 50
cd_grpo_ell: 0.25
cd_grpo_gamma: 0.7
cd_grpo_probe_fraction: 1.0
cd_grpo_length_penalty_start: 384

discovery_algo: grpo
model_id: Qwen/Qwen3-0.6B
model_basename: Qwen3-0.6B
download_model: 1
attn_implementation: sdpa
use_remove_padding: "False"
agent_loop_config_path: configs/verl/cd_grpo_agent_loop.yaml
default_agent_loop: causal_micro_lab_agent_loop

train_file: data/causal_micro_lab/trainable/verl_train.jsonl
val_file: data/causal_micro_lab/trainable/verl_val.jsonl

n_gpus_per_node: 1
train_batch_size: 8
ppo_mini_batch_size: 8
rollout_n: 16
rollout_tp: 1
rollout_gpu_mem_util: 0.40
sglang_attention_backend: flashinfer
actor_micro_batch_size_per_gpu: 1
rollout_log_prob_micro_batch_size_per_gpu: 1
rollout_calculate_log_probs: "False"
ref_log_prob_micro_batch_size_per_gpu: 1
actor_lr: 1e-6
kl_loss_coef: 0.001
entropy_coeff: 0

temperature: 1.0
top_p: 1.0
total_epochs: 1
total_training_steps: 1
save_freq: 100
test_freq: 1
max_actor_ckpt_to_keep: 1
max_critic_ckpt_to_keep: 1
max_prompt_length: 2048
max_response_length: 512
experiment_name: causal_micro_lab_runpod_cd_grpo_debug_r1

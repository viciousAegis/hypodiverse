# Base-model calibration on a manageable subset of the mixed pilot validation
# split. This estimates whether the main pilot distribution is too hard.

dataset_config: configs/verl/datasets/scattered_pilot.yaml
prepare_datasets: 1

model_id: Qwen/Qwen3-4B
download_model: 1
eval_file: data/verl/scattered_causal_pilot_val.parquet
output_dir: results/envspec_eval
run_name: scattered_pilot_base_single_subset

max_examples: 200
rollouts_per_spec: 1
eval_workers: 8
max_steps: 13
max_consecutive_invalid: 2
max_response_length: 4096
temperature: 0.6
top_p: 0.95
request_timeout_s: 600
transcripts: 0

serve_model: 1
sglang_host: 127.0.0.1
sglang_port: 30000
sglang_tp: 1
sglang_mem_fraction_static: 0.55
sglang_extra_args: "--attention-backend triton --prefill-attention-backend triton --decode-attention-backend triton --sampling-backend pytorch --disable-cuda-graph"

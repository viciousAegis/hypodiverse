# Frozen HypoDiverse evaluation for the released GRPO checkpoint.
# One bank of 16 generations supplies paired B=4,8,12,16 prefixes.

prepare_datasets: 0
causal_micro_lab_generate_dataset_if_missing: 0

model_id: viciousa3gis/hypodiverse-grpo
download_model: 1
eval_file: eval_sets/causal_micro_lab/canonical_eval/verl_test.jsonl
output_dir: artifacts/hypodiverse_eval
run_name: hypodiverse_grpo_final

rollouts_per_spec: 16
prefix_ks: 4,8,12,16
eval_workers: 128
max_response_length: 6000
temperature: 1.0
top_p: 1.0
think: true
thinking_fallback: true
fallback_max_response_length: 256
fallback_temperature: 0.0
build_eval_report: true
bootstrap_samples: 2000
request_timeout_s: 1800
transcripts: 0
wandb_project: hypodiverse

serve_model: 1
sglang_host: 127.0.0.1
sglang_port: 30000
sglang_tp: 1
sglang_mem_fraction_static: 0.82
sglang_extra_args: "--attention-backend triton --prefill-attention-backend triton --decode-attention-backend triton --sampling-backend pytorch"

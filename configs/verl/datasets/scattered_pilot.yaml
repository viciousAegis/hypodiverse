# veRL dataset-generation preset: larger scattered-causal pilot splits.
# Used by `scripts/cluster/run_verl_pilot_grpo.sh`.
defaults:
  agent_name: discovery_agent_loop
  protocol: single
  max_steps: 13
  max_consecutive_invalid: 2
  max_commit: 1
  reward_profile: terminal_only

datasets:
  - name: scattered_causal_pilot_train
    data_source: scattered_causal_mixed
    env_type: scattered_causal
    output: data/verl/scattered_causal_pilot_train.parquet
    count: 8192
    seed: 6101
    dispersion_values: [0.0, 0.25, 0.5, 0.75, 1.0]
    world_values:
      num_branches: [3, 4, 5]
      branch_depth: [2, 3, 4]
      distractors_per_node: [1, 2, 3]
      base_budget: [9, 11, 13]
    task:
      world:
        true_mean: 1.0
        false_mean: 0.0
        noise_sigma: 0.35
        accept_threshold: 0.82
        reject_threshold: 0.18
        test_cost: 1
        intervene_cost: 2
        invalid_action_cost: 1
      agent:
        include_hidden_debug_in_prompt: false
        max_evidence_items: 12

  - name: scattered_causal_pilot_val
    data_source: scattered_causal_mixed_val
    env_type: scattered_causal
    output: data/verl/scattered_causal_pilot_val.parquet
    count: 1280
    seed: 7101
    dispersion_values: [0.0, 0.25, 0.5, 0.75, 1.0]
    world_values:
      num_branches: [3, 4, 5]
      branch_depth: [2, 3, 4]
      distractors_per_node: [1, 2, 3]
      base_budget: [9, 11, 13]
    task:
      world:
        true_mean: 1.0
        false_mean: 0.0
        noise_sigma: 0.35
        accept_threshold: 0.82
        reject_threshold: 0.18
        test_cost: 1
        intervene_cost: 2
        invalid_action_cost: 1
      agent:
        include_hidden_debug_in_prompt: false
        max_evidence_items: 12

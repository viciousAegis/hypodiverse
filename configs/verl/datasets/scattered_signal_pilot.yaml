# veRL dataset-generation preset: allocation-conscious scattered-causal signal run.
# This keeps the same task distribution as scattered_pilot.yaml but uses fewer
# training prompts for the first meaningful GRPO baseline.
defaults:
  agent_name: discovery_agent_loop
  protocol: single
  max_steps: 10
  max_consecutive_invalid: 2
  max_commit: 1
  reward_profile: terminal_clean_invalid_bonus

datasets:
  - name: scattered_causal_signal_train
    data_source: scattered_causal_signal_mixed
    env_type: scattered_causal
    output: data/verl/scattered_causal_signal_train.parquet
    count: 2048
    seed: 6201
    dispersion_values: [0.0, 0.25, 0.5, 0.75, 1.0]
    base_budget_from_branch_depth_overhead: 2
    world_values:
      num_branches: [3, 4, 5]
      branch_depth: [2, 3, 4]
      distractors_per_node: [1, 2, 3]
    task:
      world:
        true_mean: 1.0
        false_mean: 0.0
        noise_sigma: 0.35
        accept_threshold: 0.82
        reject_threshold: 0.18
        test_cost: 1
        intervene_cost: 2
        invalid_action_cost: 1
      agent:
        include_hidden_debug_in_prompt: false
        max_evidence_items: 12

  - name: scattered_causal_signal_val
    data_source: scattered_causal_signal_mixed_val
    env_type: scattered_causal
    output: data/verl/scattered_causal_signal_val.parquet
    count: 320
    seed: 7201
    dispersion_values: [0.0, 0.25, 0.5, 0.75, 1.0]
    base_budget_from_branch_depth_overhead: 2
    world_values:
      num_branches: [3, 4, 5]
      branch_depth: [2, 3, 4]
      distractors_per_node: [1, 2, 3]
    task:
      world:
        true_mean: 1.0
        false_mean: 0.0
        noise_sigma: 0.35
        accept_threshold: 0.82
        reject_threshold: 0.18
        test_cost: 1
        intervene_cost: 2
        invalid_action_cost: 1
      agent:
        include_hidden_debug_in_prompt: false
        max_evidence_items: 12
